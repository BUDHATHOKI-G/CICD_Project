apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-local-monitor
  namespace: monitoring
  labels:
    release: monitoring        # MUST match Helm Prometheus release
    app: backend-local
spec:
  selector:
    matchLabels:
      app: backend-local       # MUST match the Service label above
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      interval: 15s
      path: /metrics
